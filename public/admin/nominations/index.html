<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPU Nominations</title><link rel="stylesheet" href="/assets/styles.css?v=build10"></head><body data-allowed-roles="chairman,admin,screening,secretary">
<header class="top"><div class="wrap brand-row"><div class="brand"><img src="/assets/mpu-logo.png" alt="MPU logo"><div><h1>Nominations</h1><p>Nomination, acceptance and validation records</p></div></div><nav class="nav"><a href="/admin/">← EC Admin</a><a href="/admin/candidates/">Candidate Screening</a></nav></div></header>
<main class="wrap"><div class="admin-toolbar"><span class="role-badge">Role: <span data-role-label></span></span><span class="cloud-status" data-cloud-status></span></div>
<section class="section"><div class="section-heading-row"><div><h2>Nomination Records</h2><p class="section-sub">Use the Import Center for legacy records or add/update records here.</p></div><button class="btn gold" id="addBtn">Add Nomination</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Nominee</th><th>Nominator</th><th>Office</th><th>Acceptance</th><th>Validation</th><th>Status</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></section></main>
<dialog id="dlg"><form method="dialog" id="form" style="min-width:min(92vw,620px);padding:22px"><h2>Nomination Record</h2><input type="hidden" name="id"><div class="field"><label>Nominee Name<input name="nomineeName" required></label></div><div class="field"><label>Nominee Email<input name="nomineeEmail" type="email"></label></div><div class="field"><label>Nominator Name<input name="nominatorName"></label></div><div class="field"><label>Office<input name="office"></label></div><div class="field"><label>Acceptance<select name="acceptanceStatus"><option>Pending</option><option>Accepted</option><option>Declined</option></select></label></div><div class="field"><label>Validation<select name="validationStatus"><option>Pending</option><option>Verified</option><option>Needs Review</option><option>Rejected</option></select></label></div><div class="field"><label>Status<input name="status"></label></div><div class="field"><label>Notes<textarea name="notes"></textarea></label></div><div class="report-actions"><button class="btn primary" value="save">Save</button><button class="btn ghost" value="cancel">Cancel</button></div></form></dialog>
<script src="/config.js?v=build10"></script><script type="module" src="/assets/admin-guard.js?v=build10"></script><script>
let rows=[];async function load(){await MPUCloud.ready();rows=MPUCloud.state().enabled?(await MPUCloud.getCollectionDocs('nominations')||[]):[];render()}
const pick=(r,...k)=>{for(const x of k)if(r[x]!=null&&r[x]!=='')return r[x];return ''};function render(){body.innerHTML=rows.map(r=>`<tr><td>${pick(r,'nomineeName','NOMINEE_NAME','NOMINEE')}</td><td>${pick(r,'nominatorName','NOMINATOR_NAME','NOMINATOR')}</td><td>${pick(r,'office','OFFICE','POSITION')}</td><td>${pick(r,'acceptanceStatus','ACCEPTANCE_STATUS')}</td><td>${pick(r,'validationStatus','VALIDATION_STATUS')}</td><td>${pick(r,'status','STATUS')}</td><td><button class="btn small ghost" onclick="edit('${r.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="7">No nomination records yet. Import legacy candidate data or add a record.</td></tr>'}
addBtn.onclick=()=>{form.reset();form.id.value='';dlg.showModal()};window.edit=id=>{const r=rows.find(x=>x.id===id);if(!r)return;form.id.value=r.id;form.nomineeName.value=pick(r,'nomineeName','NOMINEE_NAME','NOMINEE');form.nomineeEmail.value=pick(r,'nomineeEmail','NOMINEE_EMAIL','EMAIL');form.nominatorName.value=pick(r,'nominatorName','NOMINATOR_NAME','NOMINATOR');form.office.value=pick(r,'office','OFFICE','POSITION');form.acceptanceStatus.value=pick(r,'acceptanceStatus','ACCEPTANCE_STATUS')||'Pending';form.validationStatus.value=pick(r,'validationStatus','VALIDATION_STATUS')||'Pending';form.status.value=pick(r,'status','STATUS');form.notes.value=pick(r,'notes','NOTES');dlg.showModal()};
form.addEventListener('submit',async e=>{if(e.submitter?.value==='cancel')return;e.preventDefault();const d=Object.fromEntries(new FormData(form));d.id=d.id||'nomination-'+Date.now();await MPUCloud.setCollectionDoc('nominations',d.id,d,true);dlg.close();await load()});window.addEventListener('mpu-cloud-ready',load);
</script></body></html>
