<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPU Audit & Activity Log</title><link rel="stylesheet" href="/assets/styles.css?v=build10"></head><body data-allowed-roles="chairman,admin,secretary">
<header class="top"><div class="wrap brand-row"><div class="brand"><img src="/assets/mpu-logo.png" alt="MPU logo"><div><h1>Audit & Activity Log</h1><p>Who changed what, when, and from which role</p></div></div><nav class="nav"><a href="/admin/">← EC Admin</a></nav></div></header>
<main class="wrap"><section class="section"><div class="admin-toolbar"><span class="role-badge">Role: <span data-role-label style="margin-left:4px"></span></span><span class="cloud-status" data-cloud-status></span></div><h2>Recent Activity</h2><p class="section-sub">Firestore-backed activity appears here after Firebase credentials are connected. DEV local changes remain available for UI testing.</p><div class="table-wrap"><table class="table"><thead><tr><th>Date/Time</th><th>User</th><th>Role</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main>
<script src="/config.js?v=build10"></script><script type="module" src="/assets/admin-guard.js"></script><script>
window.addEventListener('mpu-cloud-ready',async()=>{try{if(!MPUCloud.state().enabled){rows.innerHTML='<tr><td colspan="6">Connect Firebase Web App credentials to enable shared audit history.</td></tr>';return;}const a=await MPUCloud.getAudit(75);rows.innerHTML=a.map(x=>`<tr><td>${esc(x.at||'')}</td><td>${esc(x.actorEmail||x.actorUid||'')}</td><td>${esc(x.actorRole||'')}</td><td>${esc(x.action||'')}</td><td>${esc(x.target||'')}</td><td><small>${esc(JSON.stringify(x.details||{}))}</small></td></tr>`).join('')||'<tr><td colspan="6">No audit entries yet.</td></tr>'}catch(e){rows.innerHTML='<tr><td colspan="6">'+esc(e.message)+'</td></tr>'}});function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script><script defer src="/assets/section-navigation.js"></script></body></html>
