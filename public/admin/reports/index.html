<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPU Reports & Exports</title><link rel="stylesheet" href="/assets/styles.css?v=build10"></head>
<body data-allowed-roles="chairman,admin,finance,voter_register,secretary">
<header class="top"><div class="wrap brand-row"><div class="brand"><img src="/assets/mpu-logo.png" alt="MPU logo"><div><h1>Reports & Exports</h1><p>Eligibility, finance, attendance and compliance reporting</p></div></div><nav class="nav"><a href="/admin/">← EC Admin</a><a href="/finance/">Financial Portal</a><a href="/admin/import-center/">Import Center</a></nav></div></header>
<main class="wrap reports-admin"><div class="admin-toolbar"><span class="role-badge">Role: <span data-role-label></span></span><span class="cloud-status" data-cloud-status></span></div>
<section class="section"><h2>Build a Report</h2><p class="section-sub">Filter first, review the result, then export only the records you need.</p>
<div class="report-filter-grid"><label>Report<select id="dataset"><option value="eligibility">Voter Eligibility / Qualified Register</option><option value="payments">Finance — Payments</option><option value="outstanding">Outstanding Dues / Levies</option><option value="suspension">Non-Payment / Suspension Watch</option></select></label><label>As of Date<input type="date" id="asOf"></label><label>LGA<input id="lga" placeholder="All LGAs"></label><label>Status<select id="status"><option value="">All statuses</option></select></label><label>Payment Method<select id="method"><option value="">All methods</option><option>Zelle</option><option>Cash</option><option>Check</option><option>Other / Manual</option></select></label><label>Payment Type<select id="ptype"><option value="">All types</option><option>Annual Dues</option><option>Levy</option><option>Election Levy</option><option>Special Assessment</option><option>Membership Fee</option><option>Donation</option><option>Other</option></select></label><label>From<input type="date" id="from"></label><label>To<input type="date" id="to"></label></div>
<div class="report-actions"><button class="btn primary" id="runReport">Run Report</button><button class="btn ghost" id="qualifiedBtn">Export Qualified Voter Register</button><button class="btn ghost" id="lastQuarterZelle">Zelle — Last Quarter</button></div></section>
<section class="section"><div class="section-heading-row"><div><h2 id="reportTitle">Report Results</h2><p class="section-sub" id="reportMeta"></p></div><div class="export-row"><button class="btn small ghost" id="csvBtn">CSV</button><button class="btn small ghost" id="xlsxBtn">Excel</button><button class="btn small gold" id="pdfBtn">PDF</button></div></div><div class="metric-row"><div class="metric"><b id="rowCount">0</b>Records</div><div class="metric"><b id="amountTotal">$0</b>Total Amount</div></div><div class="table-wrap"><table class="table"><thead id="head"></thead><tbody id="body"></tbody></table></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
<script src="/config.js?v=build10"></script><script src="/assets/data-tools.js?v=build10"></script><script type="module" src="/assets/admin-guard.js?v=build10"></script>
<script>
const D=MPUDataTools;let members=[],payments=[],obligations=[],rows=[],cols=[];const localGet=k=>JSON.parse(localStorage.getItem(k)||'[]');
function eligibility(m){const att=String(m.attendanceStatus||'').toLowerCase(),fin=String(m.financialStatus||'').toLowerCase(),mem=String(m.membershipStatus||'active').toLowerCase();let reasons=[];if(!att)reasons.push('Attendance needs review');else if(att.includes('not')||att.includes('below')||att.includes('fail'))reasons.push('Attendance');if(!fin)reasons.push('Financial status needs review');else if(fin.includes('owe')||fin.includes('delinq')||fin.includes('not current'))reasons.push('Financial');if(mem.includes('inactive')||mem.includes('suspend')||mem.includes('probation'))reasons.push('Membership status');const hard=reasons.filter(x=>!x.includes('needs review'));return {eligibility:hard.length?'Not Qualified':reasons.length?'Needs Review':'Qualified',reason:reasons.join('; ')||'—'};}
function qStartLastQuarter(){const d=new Date();const q=Math.floor(d.getMonth()/3);let y=d.getFullYear(),mq=(q-1)*3;if(q===0){y--;mq=9}return new Date(y,mq,1)}
function qEndLastQuarter(){const s=qStartLastQuarter();return new Date(s.getFullYear(),s.getMonth()+3,0)}
async function load(){await MPUCloud.ready();if(MPUCloud.state().enabled){members=await MPUCloud.getCollectionDocs('members')||[];payments=await MPUCloud.getCollectionDocs('payments')||[];obligations=await MPUCloud.getCollectionDocs('duesObligations')||[];}else{members=localGet('mpu_members');payments=localGet('mpu_payments');obligations=localGet('mpu_duesObligations');}const qp=new URLSearchParams(location.search).get('dataset');if(qp)dataset.value=qp;setStatuses();run();}
function setStatuses(){const map={eligibility:['Qualified','Not Qualified','Needs Review'],payments:['Verified','Pending','Needs Review','Rejected'],outstanding:['Owes','Partial','Overdue','Current'],suspension:['Watch','5-Month Warning','Suspension Review','Needs Review','Current']};status.innerHTML='<option value="">All statuses</option>'+map[dataset.value].map(x=>`<option>${x}</option>`).join('');}
function run(){const as=asOf.value||new Date().toISOString().slice(0,10);if(dataset.value==='payments'){rows=payments.filter(p=>(!method.value||p.paymentMethod===method.value)&&(!ptype.value||p.paymentType===ptype.value)&&(!status.value||p.verificationStatus===status.value)&&(!from.value||String(p.paymentDate||'')>=from.value)&&(!to.value||String(p.paymentDate||'')<=to.value)).map(p=>({Date:p.paymentDate,Member:p.memberName,Email:p.email,Method:p.paymentMethod,Type:p.paymentType,Amount:Number(p.amount||0).toFixed(2),Status:p.verificationStatus,Reference:p.referenceNumber||''}));cols=['Date','Member','Email','Method','Type','Amount','Status','Reference'];reportTitle.textContent='Finance Payment Report';}
else if(dataset.value==='outstanding'){rows=obligations.filter(o=>(!lga.value||String(o.lga||'').toLowerCase().includes(lga.value.toLowerCase()))&&(!status.value||String(o.status||'')===status.value)&&(!ptype.value||String(o.obligationType||'')===ptype.value)&&(!from.value||String(o.dueDate||o.periodStart||'')>=from.value)&&(!to.value||String(o.dueDate||o.periodEnd||'')<=to.value)).map(o=>({Member:o.memberName||'',Email:o.email||'',LGA:o.lga||'',Type:o.obligationType||'',Period:`${o.periodStart||''}${o.periodEnd?' – '+o.periodEnd:''}`, 'Due Date':o.dueDate||'', 'Amount Due':Number(o.amountDue||0).toFixed(2),'Amount Paid':Number(o.amountPaid||0).toFixed(2),Balance:Number(o.balance||0).toFixed(2),Status:o.status||((Number(o.balance||0)>0)?'Owes':'Current')}));cols=['Member','Email','LGA','Type','Period','Due Date','Amount Due','Amount Paid','Balance','Status'];reportTitle.textContent='Outstanding Dues / Levies Report';}
else if(dataset.value==='suspension'){rows=members.map(m=>({...m,...D.suspensionStatus(m,as,5,6)})).filter(m=>(!lga.value||String(m.lga||'').toLowerCase().includes(lga.value.toLowerCase()))&&(!status.value||m.status===status.value)).map(m=>({Member:m.fullName,Email:m.email,LGA:m.lga,'Last Payment':m.lastQualifyingPaymentDate,'Months Unpaid':m.monthsUnpaid??'','Status':m.status,'Projected Suspension':m.projectedSuspensionDate,'Amount Owed':Number(m.amountOwed||0).toFixed(2),Reason:m.reason}));cols=['Member','Email','LGA','Last Payment','Months Unpaid','Status','Projected Suspension','Amount Owed','Reason'];reportTitle.textContent='Non-Payment & Suspension Watch';}
else{rows=members.map(m=>({...m,...eligibility(m)})).filter(m=>(!lga.value||String(m.lga||'').toLowerCase().includes(lga.value.toLowerCase()))&&(!status.value||m.eligibility===status.value)).map(m=>({Member:m.fullName,Email:m.email,LGA:m.lga,'Membership Status':m.membershipStatus,'Attendance Status':m.attendanceStatus,'Financial Status':m.financialStatus,'Eligibility':m.eligibility,'Reason':m.reason,'As Of':as}));cols=['Member','Email','LGA','Membership Status','Attendance Status','Financial Status','Eligibility','Reason','As Of'];reportTitle.textContent='Voter Eligibility / Qualification Report';}render(as);}
function render(as){head.innerHTML='<tr>'+cols.map(c=>`<th>${D.esc(c)}</th>`).join('')+'</tr>';body.innerHTML=rows.map(r=>'<tr>'+cols.map(c=>`<td>${D.esc(r[c])}</td>`).join('')+'</tr>').join('')||`<tr><td colspan="${cols.length||1}">No records match this report.</td></tr>`;rowCount.textContent=rows.length;amountTotal.textContent=dataset.value==='payments'?'$'+rows.reduce((a,r)=>a+Number(r.Amount||0),0).toFixed(2):dataset.value==='outstanding'?'$'+rows.reduce((a,r)=>a+Number(r.Balance||0),0).toFixed(2):'$0';reportMeta.textContent=`As of ${as} · ${rows.length} record(s) · Filters are reflected in exported files.`;}
function name(){return 'MPU_'+dataset.value+'_report_'+(asOf.value||new Date().toISOString().slice(0,10));}
dataset.onchange=()=>{setStatuses();run()};[asOf,lga,status,method,ptype,from,to].forEach(x=>x.onchange=run);runReport.onclick=run;csvBtn.onclick=()=>D.exportCSV(rows,name(),cols);xlsxBtn.onclick=()=>D.exportExcel(rows,name());pdfBtn.onclick=()=>D.exportPDF(rows,name(),reportTitle.textContent,cols);
qualifiedBtn.onclick=()=>{dataset.value='eligibility';setStatuses();status.value='Qualified';run();D.exportExcel(rows,'MPU_Qualified_Voter_Register_'+asOf.value);};lastQuarterZelle.onclick=()=>{dataset.value='payments';setStatuses();method.value='Zelle';from.value=qStartLastQuarter().toISOString().slice(0,10);to.value=qEndLastQuarter().toISOString().slice(0,10);run();};
asOf.value=new Date().toISOString().slice(0,10);window.addEventListener('mpu-cloud-ready',load);setTimeout(()=>{if(window.MPUCloud)load()},400);
</script><script defer src="/assets/section-navigation.js"></script></body></html>
