<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPU Candidate Screening</title><link rel="stylesheet" href="/assets/styles.css?v=build10"></head><body data-allowed-roles="chairman,admin,screening,secretary">
<header class="top"><div class="wrap brand-row"><div class="brand"><img src="/assets/mpu-logo.png" alt="MPU logo"><div><h1>Candidate Screening</h1><p>Candidate records, eligibility, credentials and screening status</p></div></div><nav class="nav"><a href="/admin/">← EC Admin</a><a href="/admin/nominations/">Nominations</a></nav></div></header>
<main class="wrap"><div class="admin-toolbar"><span class="role-badge">Role: <span data-role-label></span></span><span class="cloud-status" data-cloud-status></span></div>
<section class="section"><div class="section-heading-row"><div><h2>Candidate Records</h2><p class="section-sub">Imported candidate records and new records are stored in Firestore.</p></div><button class="btn gold" id="addBtn">Add Candidate</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Office</th><th>Eligibility</th><th>Screening</th><th>Status</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></section></main>
<dialog id="dlg"><form method="dialog" id="form" style="min-width:min(92vw,620px);padding:22px"><h2>Candidate Record</h2><input type="hidden" name="id"><div class="field"><label>Full Name<input name="fullName" required></label></div><div class="field"><label>Email<input name="email" type="email"></label></div><div class="field"><label>Office<input name="selectedOffice"></label></div><div class="field"><label>Eligibility<select name="eligibilityStatus"><option>Needs Review</option><option>Eligible</option><option>Not Eligible</option></select></label></div><div class="field"><label>Screening<select name="screeningStatus"><option>Pending</option><option>Under Review</option><option>Qualified</option><option>Not Qualified</option></select></label></div><div class="field"><label>Status<input name="status" placeholder="Active / Withdrawn / etc."></label></div><div class="field"><label>Notes<textarea name="notes"></textarea></label></div><div class="report-actions"><button class="btn primary" value="save">Save</button><button class="btn ghost" value="cancel">Cancel</button></div></form></dialog>
<script src="/config.js?v=build10"></script><script type="module" src="/assets/admin-guard.js?v=build10"></script><script>
let rows=[];async function load(){await MPUCloud.ready();rows=MPUCloud.state().enabled?(await MPUCloud.getCollectionDocs('candidates')||[]):[];render()}
function render(){body.innerHTML=rows.map(r=>`<tr><td>${r.fullName||r.FULL_NAME||r.NAME||''}</td><td>${r.email||r.EMAIL||''}</td><td>${r.selectedOffice||r.SELECTED_OFFICE||r.OFFICE||''}</td><td>${r.eligibilityStatus||r.ELIGIBILITY_STATUS||''}</td><td>${r.screeningStatus||r.SCREENING_STATUS||''}</td><td>${r.status||r.STATUS||''}</td><td><button class="btn small ghost" onclick="edit('${r.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="7">No candidate records yet. Import legacy candidate data or add a record.</td></tr>'}
addBtn.onclick=()=>{form.reset();form.id.value='';dlg.showModal()};window.edit=id=>{const r=rows.find(x=>x.id===id);if(!r)return;form.id.value=r.id;form.fullName.value=r.fullName||r.FULL_NAME||r.NAME||'';form.email.value=r.email||r.EMAIL||'';form.selectedOffice.value=r.selectedOffice||r.SELECTED_OFFICE||r.OFFICE||'';form.eligibilityStatus.value=r.eligibilityStatus||r.ELIGIBILITY_STATUS||'Needs Review';form.screeningStatus.value=r.screeningStatus||r.SCREENING_STATUS||'Pending';form.status.value=r.status||r.STATUS||'';form.notes.value=r.notes||r.NOTES||'';dlg.showModal()};
form.addEventListener('submit',async e=>{if(e.submitter?.value==='cancel')return; e.preventDefault();const d=Object.fromEntries(new FormData(form));d.id=d.id||'candidate-'+Date.now();await MPUCloud.setCollectionDoc('candidates',d.id,d,true);dlg.close();await load()});window.addEventListener('mpu-cloud-ready',load);
</script><script defer src="/assets/section-navigation.js"></script><script defer src="/assets/designer-credit.js"></script></body></html>
