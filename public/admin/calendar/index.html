<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPU Calendar Management</title><link rel="stylesheet" href="/assets/styles.css?v=build10"></head><body data-allowed-roles="chairman,admin,secretary,communications"><header class="top"><div class="wrap brand-row"><div class="brand"><img src="/assets/mpu-logo.png" alt="MPU logo"><div><h1>Calendar Management</h1><p>Edit the source of Current → Next → Upcoming</p></div></div><nav class="nav"><a href="/admin/">← EC Admin</a><a href="/event-calendar/">Public Calendar</a></nav></div></header><main class="wrap"><div class="admin-toolbar"><span class="role-badge">Role: <span data-role-label style="margin-left:4px"></span></span><span class="cloud-status" data-cloud-status></span></div><section class="section"><h2>Add / Edit Event</h2><p id="calendarStatus" role="status"></p><p><button class="btn primary" id="importTimetable" type="button">Import Official Timetable</button></p><p class="section-sub">Published dates automatically drive the public timeline. Register-review phases can point members directly to “Check My Record.”</p><form id="f"><input type="hidden" name="idx"><div class="grid2"><div class="field"><label>Event Title</label><input required name="title"></div><div class="field"><label>Display Date</label><input name="displayDate" placeholder="Oct 18, 2026 • 5:00 PM"></div><div class="field"><label>Start (Eastern Time)</label><input required type="datetime-local" name="start"></div><div class="field"><label>End (Eastern Time)</label><input type="datetime-local" name="end"></div><div class="field"><label>Phase Type</label><select name="phaseType"><option value="general">General</option><option value="education">Education</option><option value="register-review">Register Review</option><option value="meeting">Meeting</option><option value="validation">Validation</option><option value="screening">Screening</option><option value="publication">Publication</option><option value="campaign">Campaign</option><option value="deadline">Deadline</option><option value="election">Election</option></select></div><div class="field"><label>Action Button Label</label><input name="actionLabel" placeholder="Check My Record"></div><div class="field"><label>Action URL</label><input name="actionUrl" placeholder="/register-review/"></div></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><label><input type="checkbox" name="published" checked> Published</label><p><button class="btn gold">Save Event</button> <button type="button" class="btn ghost" id="clearEvent">Clear</button></p></form></section><section class="section"><h2>Events</h2><div id="rows"></div></section></main><script src="/config.js?v=build10"></script><script src="/assets/runtime.js?v=build10"></script><script type="module" src="/assets/admin-guard.js"></script><script type="module" src="/assets/calendar-admin.js"></script><script defer src="/assets/section-navigation.js"></script><script defer src="/assets/designer-credit.js"></script></body></html>
