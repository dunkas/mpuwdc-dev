<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPU Calendar Management</title><link rel="stylesheet" href="/assets/styles.css?v=build10"></head><body data-allowed-roles="chairman,admin,secretary,communications"><header class="top"><div class="wrap brand-row"><div class="brand"><img src="/assets/mpu-logo.png" alt="MPU logo"><div><h1>Calendar Management</h1><p>Edit the source of Current → Next → Upcoming</p></div></div><nav class="nav"><a href="/admin/">← EC Admin</a><a href="/event-calendar/">Public Calendar</a></nav></div></header><main class="wrap"><div class="admin-toolbar"><span class="role-badge">Role: <span data-role-label style="margin-left:4px"></span></span><span class="cloud-status" data-cloud-status></span></div><section class="section"><h2>Add / Edit Event</h2><p class="section-sub">Published dates automatically drive the public timeline. Register-review phases can point members directly to “Check My Record.”</p><form id="f"><input type="hidden" name="idx"><div class="grid2"><div class="field"><label>Event Title</label><input required name="title"></div><div class="field"><label>Display Date</label><input name="displayDate" placeholder="Oct 18, 2026 • 5:00 PM"></div><div class="field"><label>Start</label><input required type="datetime-local" name="start"></div><div class="field"><label>End</label><input type="datetime-local" name="end"></div><div class="field"><label>Phase Type</label><select name="phaseType"><option value="general">General</option><option value="education">Education</option><option value="register-review">Register Review</option><option value="meeting">Meeting</option><option value="validation">Validation</option><option value="screening">Screening</option><option value="publication">Publication</option><option value="campaign">Campaign</option><option value="deadline">Deadline</option><option value="election">Election</option></select></div><div class="field"><label>Action Button Label</label><input name="actionLabel" placeholder="Check My Record"></div><div class="field"><label>Action URL</label><input name="actionUrl" placeholder="/register-review/"></div></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><label><input type="checkbox" name="published" checked> Published</label><p><button class="btn gold">Save Event</button> <button type="button" class="btn ghost" onclick="resetForm()">Clear</button></p></form></section><section class="section"><h2>Events</h2><div id="rows"></div></section></main><script src="/config.js?v=build10"></script><script src="/assets/runtime.js?v=build10"></script><script type="module" src="/assets/admin-guard.js"></script><script>
const R=MPURuntime;function load(){return R.getEvents()}async function save(a,changed=null,deletedId=null){R.saveEvents(a);render();if(window.MPUCloud&&MPUCloud.state().enabled){try{if(deletedId)await MPUCloud.deleteEvent(deletedId);else if(changed)await MPUCloud.saveEvent(changed)}catch(e){alert('Saved locally, but Firebase sync failed: '+e.message)}}}function resetForm(){f.reset();f.idx.value='';f.published.checked=true}f.onsubmit=e=>{e.preventDefault();const a=load(),d=Object.fromEntries(new FormData(f).entries());d.published=f.published.checked;d.id=d.id||('evt-'+Date.now());const i=f.idx.value;if(i==='')a.push(d);else d.id=a[+i].id||d.id,a[+i]=d;save(a,d);resetForm()};function edit(i){const x=load()[i];for(const k of ['title','displayDate','start','end','description','phaseType','actionLabel','actionUrl'])if(f[k])f[k].value=x[k]||'';f.published.checked=x.published!==false;f.idx.value=i;scrollTo(0,0)}function del(i){if(confirm('Delete this event?')){const a=load();const id=a[i].id;a.splice(i,1);save(a,null,id)}}function render(){rows.innerHTML=load().sort((a,b)=>R.parseDate(a.start)-R.parseDate(b.start)).map((x,i)=>`<div class="event-row"><div class="event-date">${R.esc(x.displayDate||x.start)}</div><div><h3>${R.esc(x.title)}</h3><p>${R.esc(x.description||'')}</p><p><b>${x.published!==false?'Published':'Hidden'}</b> · ${R.esc(x.phaseType||'general')}${x.actionLabel?' · Action: '+R.esc(x.actionLabel):''}</p><button class="btn small primary" onclick="edit(${i})">Edit</button> <button class="btn small ghost" onclick="del(${i})">Delete</button></div></div>`).join('')||'<p>No events yet.</p>'}window.addEventListener('mpu-cloud-ready',async()=>{try{if(MPUCloud.state().enabled){const a=await MPUCloud.getEvents();if(a&&a.length){R.saveEvents(a);render();}}}catch(e){console.warn(e)}});render();
</script></body></html>
